<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager Scheletro</title>
  <style>
    body { font-family: Arial; max-width: 500px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; }
    input, button { padding: 8px; margin: 5px 0; }
    ul { list-style: none; padding: 0; }
    li { border: 1px solid #ddd; padding: 10px; margin: 5px 0; display: flex; justify-content: space-between; align-items: center; }
    .completed { text-decoration: line-through; color: gray; }
  </style>
</head>
<body>

  <h1>Task Manager</h1>

  <input type="text" id="taskInput" placeholder="Nuova attività...">
  <button onclick="addTask()">Aggiungi</button>

  <ul id="taskList"></ul>

  <script>
    function addTask() {
      const input = document.getElementById('taskInput');
      const taskText = input.value.trim();
      if (taskText === '') return;

      const li = document.createElement('li');

      const span = document.createElement('span');
      span.textContent = taskText;
      span.onclick = () => span.classList.toggle('completed');

      const btn = document.createElement('button');
      btn.textContent = 'Elimina';
      btn.onclick = () => li.remove();

      li.appendChild(span);
      li.appendChild(btn);

      document.getElementById('taskList').appendChild(li);

      input.value = '';
    }
  </script>

</body>
</html>
